name: Windows CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  verify:
    name: Verify Windows x64 build
    runs-on: windows-latest

    steps:
      - name: Check out pull request source
        uses: actions/checkout@v7

      - name: Set up native CPython x64
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-desktop.txt
            packaging/requirements-build.txt

      - name: Set up Node.js for JavaScript tests
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install core, desktop, and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt `
            -r packaging/requirements-desktop.txt `
            -r packaging/requirements-build.txt `
            pytest ruff

      - name: Run Python tests
        shell: pwsh
        run: python -m pytest -m "not browser"

      - name: Run JavaScript tests
        shell: pwsh
        run: node --test tests/js/reconcile.test.js

      - name: Run Ruff
        shell: pwsh
        run: python -m ruff check .

      - name: Cache FFmpeg download
        uses: actions/cache@v6
        with:
          path: packaging/cache
          key: ffmpeg-9.0.2-essentials-windows-x64

      - name: Build portable distribution
        shell: pwsh
        run: .\packaging\build.ps1 -SkipTests

      - name: Upload Windows distribution
        uses: actions/upload-artifact@v7
        with:
          name: karaoke-app-windows-pr
          path: |
            dist/karaoke-app-*-win64.zip
            dist/karaoke-app-*-win64.zip.sha256
          if-no-files-found: error
