name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish (for example v0.0.2)."
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 distribution
    runs-on: windows-latest
    outputs:
      release_tag: ${{ steps.release-info.outputs.tag }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          # A manual dispatch must build the requested tag, not the default branch.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          fetch-depth: 0

      - name: Determine release tag and version
        id: release-info
        shell: pwsh
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = $env:INPUT_RELEASE_TAG
          } else {
            $tag = $env:GITHUB_REF_NAME
          }
          $tag = $tag.Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid release tag '$tag'; expected an existing tag such as v0.0.2."
          }

          $tagCommit = (& git rev-parse "refs/tags/$tag^{commit}" 2>$null).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $tagCommit) {
            throw "Tag '$tag' was not found. Manual releases must use an existing pushed tag."
          }
          $headCommit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $headCommit) {
            throw "Could not determine the checked-out commit."
          }
          if ($tagCommit -ne $headCommit) {
            throw "Checked-out commit '$headCommit' does not match tag '$tag' ($tagCommit)."
          }

          $version = $tag.Substring(1)
          $match = Select-String -Path "karaoke/version.py" -Pattern '__version__\s*=\s*"([^"]+)"'
          if (-not $match) { throw "Could not read karaoke/version.py." }
          $sourceVersion = $match.Matches[0].Groups[1].Value
          if ($sourceVersion -ne $version) {
            throw "Tag $tag does not match karaoke/version.py ($sourceVersion)."
          }

          "KARAOKE_TAG=$tag" >> $env:GITHUB_ENV
          "KARAOKE_VERSION=$version" >> $env:GITHUB_ENV
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Building release tag $tag at commit $headCommit."

      - name: Set up native CPython x64
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-desktop.txt
            packaging/requirements-build.txt

      - name: Set up Node.js for JavaScript tests
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install core, desktop, and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt `
            -r packaging/requirements-desktop.txt `
            -r packaging/requirements-build.txt `
            pytest ruff

      - name: Run Python tests
        shell: pwsh
        run: python -m pytest -m "not browser"

      - name: Run JavaScript tests
        shell: pwsh
        run: node --test "tests/js/*.test.js"

      - name: Run Ruff
        shell: pwsh
        run: python -m ruff check .

      - name: Cache FFmpeg download
        uses: actions/cache@v6
        with:
          path: packaging/cache
          key: ffmpeg-9.0.2-essentials-windows-x64

      - name: Build portable distribution
        shell: pwsh
        run: .\packaging\build.ps1 -Version $env:KARAOKE_VERSION -SkipTests

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: karaoke-app-windows
          path: |
            dist/karaoke-app-*-win64.zip
            dist/karaoke-app-*-win64.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub pre-release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      KARAOKE_TAG: ${{ needs.build.outputs.release_tag }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ format('refs/tags/{0}', needs.build.outputs.release_tag) }}
          fetch-depth: 0

      - name: Download distribution artifact
        uses: actions/download-artifact@v8
        with:
          name: karaoke-app-windows
          path: release

      - name: Validate tag against application version
        shell: pwsh
        run: |
          $tag = $env:KARAOKE_TAG
          if (-not $tag) { throw "No release tag was supplied." }
          $tagCommit = (& git rev-parse "refs/tags/$tag^{commit}" 2>$null).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $tagCommit) {
            throw "Release tag '$tag' was not found."
          }
          $headCommit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $headCommit) {
            throw "Could not determine the checked-out commit."
          }
          if ($tagCommit -ne $headCommit) {
            throw "Release checkout is not the commit for tag '$tag'."
          }
          $match = Select-String -Path "karaoke/version.py" -Pattern '__version__\s*=\s*"([^"]+)"'
          if (-not $match) { throw "Could not read karaoke/version.py." }
          $sourceVersion = $match.Matches[0].Groups[1].Value
          if ($sourceVersion -ne $tag.Substring(1)) {
            throw "Tag $tag does not match karaoke/version.py ($sourceVersion)."
          }
          "KARAOKE_VERSION=$($tag.Substring(1))" >> $env:GITHUB_ENV
          Write-Host "Validated release tag $tag at commit $headCommit."

      - name: Prepare release notes
        shell: pwsh
        run: |
          $template = Get-Content packaging/release-notes-template.md -Raw
          $notes = $template.Replace("{{VERSION}}", $env:KARAOKE_TAG)
          Set-Content -Path release-notes.md -Value $notes -Encoding UTF8

      - name: Ensure the release does not already exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:KARAOKE_TAG
          $releaseJson = gh release list --limit 1000 --json tagName
          $listExitCode = $LASTEXITCODE
          if ($listExitCode -ne 0) {
            throw "Could not list GitHub releases (gh exit code $listExitCode). Check authentication, network access, and repository permissions."
          }

          try {
            $releases = @($releaseJson | ConvertFrom-Json -ErrorAction Stop)
          } catch {
            throw "GitHub CLI returned an invalid release list: $($_.Exception.Message)"
          }

          $existing = @($releases | Where-Object { $_.tagName -ceq $tag })
          if ($existing.Count -gt 0) {
            throw "Release '$tag' already exists. Existing releases are never overwritten."
          }
          Write-Host "Release '$tag' does not exist; continuing."

      - name: Publish pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = Get-ChildItem release -Recurse -Filter 'karaoke-app-*-win64.zip' |
            Select-Object -First 1
          $checksum = Get-ChildItem release -Recurse -Filter 'karaoke-app-*-win64.zip.sha256' |
            Select-Object -First 1
          if (-not $zip -or -not $checksum) {
            throw "Distribution ZIP or checksum missing."
          }
          gh release create $env:KARAOKE_TAG `
            $zip.FullName `
            $checksum.FullName `
            --title "Karaoke App $env:KARAOKE_TAG" `
            --notes-file release-notes.md `
            --prerelease `
            --verify-tag
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed with exit code $LASTEXITCODE."
          }
